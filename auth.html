
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | WattMetrica</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="brand-symbol">ϟ</span>
        <span>Watt<span class="accent">Metrica</span></span>
      </a>
      <a href="index.html" class="back-link">
        ← Back to calculator
      </a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <span class="auth-icon">⚡</span>
        <h1 id="formTitle">Welcome back</h1>
        <p id="formDescription">
          Sign in to your WattMetrica account.
        </p>
      </div>

      <form id="authForm">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input type="email"
                 id="email"
                 autocomplete="email"
                 required
                 placeholder="you@example.com">
        </div>

        <div class="auth-field" id="passwordGroup">
          <label for="password">Password</label>
          <input type="password"
                 id="password"
                 minlength="6"
                 autocomplete="current-password"
                 required
                 placeholder="Enter your password">
        </div>

        <p id="authMessage" class="auth-message"
           role="status" aria-live="polite" hidden></p>

        <button type="submit" id="submitButton"
                class="auth-submit">
          Log In
        </button>
      </form>

      <div class="auth-links">
        <button type="button" id="switchMode">
          Don't have an account? Sign Up
        </button>

        <button type="button" id="forgotPassword">
          Forgot password?
        </button>
      </div>
    </section>
  </main>
</body>
</html>
